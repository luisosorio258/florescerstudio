<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<!-- Fonte da imagem de partilha (og-image.png, 1200x630). Gerada com o Chrome em modo headless; ver README. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
  body{
    background:#F4EEE6;color:#3A1D14;font-family:"Jost",sans-serif;
    display:grid;grid-template-columns:1fr 380px;align-items:center;
    position:relative;
  }
  .blob{position:absolute;width:620px;height:560px;right:-160px;top:-170px;border-radius:58% 42% 63% 37% / 45% 55% 45% 55%;background:radial-gradient(circle at 30% 30%,#DDC5AD,#EADBCB 70%);}
  .copy{position:relative;padding-left:90px;display:flex;flex-direction:column;gap:26px;}
  .logo{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .logo b{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;letter-spacing:.06em;}
  .logo small{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.42em;margin-top:6px;font-weight:500;padding-left:34px;}
  .logo small::before,.logo small::after{content:"";width:26px;height:1px;background:currentColor;}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:96px;line-height:1;margin:0;}
  h1 em{color:#94492B;}
  .kicker{font-size:20px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#94492B;}
  .arch{position:relative;width:300px;height:400px;border-radius:999px 999px 14px 14px;background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.35),transparent 60%),linear-gradient(170deg,#DDC5AD 0%,#B4623F 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:34px 30px;color:#F4EEE6;box-sizing:border-box;}
  .arch::before{content:"";position:absolute;inset:12px;border-radius:999px 999px 8px 8px;border:1px solid rgba(244,238,230,.55);}
  .arch span{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:40px;line-height:1.02;}
  .arch small{font-size:13px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;margin-bottom:12px;}
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="copy">
    <div class="logo"><b>FLORESCER</b><small>STUDIO</small></div>
    <h1>A beleza<br>de <em>ser.</em></h1>
    <div class="kicker">Manicure · Pedicure · Nail design · Valença</div>
  </div>
  <div class="arch"><small>Por marcação</small><span>Mãos,</span><span>pés &amp;</span><span>nail design</span></div>
</body>
</html>
