<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de marcação online — Florescer Studio</title>
<!-- Página de TESTE do Cal.com. Não está ligada a nenhuma outra página e não deve ser indexada. Apagar ou substituir quando o teste terminar. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .booking{padding-block:40px 80px;}
  .booking .section-head{margin-bottom:24px;}
  .section-title{font-size:2.3rem;font-weight:400;}
  @media (min-width:720px){ .section-title{font-size:3rem;} }
  .cal-frame{
    min-height:640px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--paper);
    overflow:hidden;
  }
  .cal-missing{
    padding:28px;
    display:flex;flex-direction:column;gap:10px;
    color:var(--ink-soft);
  }
  .cal-missing code{background:var(--areia);padding:2px 6px;border-radius:6px;color:var(--ink);}
</style>
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="./" aria-label="Florescer Studio, página inicial">
        <span class="logo-word">Florescer</span>
        <span class="logo-sub">Studio</span>
      </a>
    </div>
  </header>

  <main>
    <section class="booking">
      <div class="wrap">
        <div class="section-head">
          <div class="eyebrow">Teste · marcação online</div>
          <h1 class="section-title">Marca o teu horário</h1>
          <p class="section-sub">Escolhe o serviço, o dia e a hora. A marcação fica pendente até ser confirmada pelo studio.</p>
        </div>
        <div class="cal-frame" id="cal-inline"></div>
      </div>
    </section>
  </main>

  <script>
    // Link público do Cal.com: o nome de utilizador (ex.: "florescerstudio") mostra todos os serviços;
    // "florescerstudio/verniz-gel" abre só um serviço.
    var CAL_LINK = "";
    var BRAND = "#3A1D14";

    if (!CAL_LINK) {
      document.getElementById("cal-inline").innerHTML =
        '<div class="cal-missing"><strong>Falta o link do Cal.com.</strong>' +
        '<span>Preencher <code>CAL_LINK</code> no fim do ficheiro <code>teste-marcacao.html</code> com o nome de utilizador do Cal.com.</span></div>';
    } else {
      (function (C, A, L) {
        var p = function (a, ar) { a.q.push(ar); };
        var d = C.document;
        C.Cal = C.Cal || function () {
          var cal = C.Cal;
          var ar = arguments;
          if (!cal.loaded) {
            cal.ns = {};
            cal.q = cal.q || [];
            d.head.appendChild(d.createElement("script")).src = A;
            cal.loaded = true;
          }
          if (ar[0] === L) {
            var api = function () { p(api, arguments); };
            var namespace = ar[1];
            api.q = api.q || [];
            if (typeof namespace === "string") {
              cal.ns[namespace] = cal.ns[namespace] || api;
              p(cal.ns[namespace], ar);
              p(cal, ["initNamespace", namespace]);
            } else p(cal, ar);
            return;
          }
          p(cal, ar);
        };
      })(window, "https://app.cal.com/embed/embed.js", "init");

      Cal("init", { origin: "https://cal.com" });
      Cal("inline", {
        elementOrSelector: "#cal-inline",
        calLink: CAL_LINK,
        config: { layout: "month_view", theme: "light" }
      });
      Cal("ui", {
        theme: "light",
        hideEventTypeDetails: false,
        cssVarsPerTheme: { light: { "cal-brand": BRAND } }
      });
    }
  </script>
</body>
</html>
